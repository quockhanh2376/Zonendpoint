name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-ci:
    name: Windows CI (Rust + Node)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: "src-tauri -> src-tauri/target"

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Install npm dependencies
        if: always()
        run: npm ci

      - name: Build frontend
        if: always()
        run: npm run build

  feeds-test:
    name: Feeds Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Run scripts/feeds unit tests
        env:
          PYTHONPATH: scripts/feeds
        run: python -m unittest discover -s scripts/feeds -p "test_*.py"

  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Setup Rust stable
        if: always()
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo-audit binary
        if: always()
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-ubuntu-latest

      - name: Install cargo-audit
        if: always()
        run: which cargo-audit || cargo install cargo-audit --locked

      # Ignore known libsqlite3-sys vulnerability RUSTSEC-2026-0459 (CVE-2026-119375) on this branch;
      # upgrade is scheduled for client 0.3.1 branch (Task V-61 / client 0.3.1 upgrade).
      # Warnings (unmaintained/unsound/yanked) are reported without failing the job.
      - name: cargo audit
        if: always()
        working-directory: src-tauri
        run: cargo audit --ignore RUSTSEC-2026-0459
